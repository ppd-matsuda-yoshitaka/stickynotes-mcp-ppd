[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sticky-notes-mcp-readonly"
version = "0.2.0"
description = "MCP server for Windows Microsoft Sticky Notes (read-only by default; optional create/append)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sticky-notes-mcp-readonly = "server:main"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
