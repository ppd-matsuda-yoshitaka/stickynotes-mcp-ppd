[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sticky-notes-mcp-readonly"
version = "0.3.0"
description = "Windows Sticky Notes MCP (read-only by default; optional create/append and window layout)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sticky-notes-mcp-readonly = "server:main"

[tool.hatch.build.targets.wheel]
include = ["server.py", "note_layout.py", "windows_layout.ps1", "windows_layout.cs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
